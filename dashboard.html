<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Dashboard · AA Jino EV</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f0f4f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .operator-header {
            background: #ffffff;
            padding: 14px 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border-bottom: 1px solid #e9edf4;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .operator-header .brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: #1e3c5c;
            letter-spacing: -0.3px;
        }

        .operator-header .brand i {
            color: #28a745;
            margin-right: 10px;
        }

        .operator-header .brand small {
            font-weight: 400;
            font-size: 0.75rem;
            color: #6c7a8a;
            margin-left: 6px;
            letter-spacing: 0.3px;
        }

        .operator-header .page-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1e3c5c;
            margin: 0;
        }

        .operator-header .page-title i {
            color: #28a745;
            margin-right: 8px;
        }

        .operator-header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            color: #1e3c5c;
        }

        .operator-header .user-info i {
            font-size: 1.4rem;
            color: #28a745;
        }

        .badge-operator {
            background: #e8f5e9;
            color: #1e7e34;
            font-weight: 500;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .logout-link {
            color: #dc3545;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 8px;
        }

        .logout-link:hover {
            background: #fce4e4;
        }

        /* DASHBOARD */
        .dashboard-wrapper {
            flex: 1;
            padding: 28px 20px 20px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-weight: 600;
            color: #1e3c5c;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .section-subtitle {
            color: #6c7a8a;
            font-size: 0.9rem;
            margin-bottom: 24px;
            border-left: 4px solid #28a745;
            padding-left: 14px;
        }

        /* PORT CARD */
        .port-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        .port-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            padding: 14px 18px;
            border-bottom: 1px solid #eef2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .port-label {
            font-weight: 600;
            color: #1e3c5c;
            font-size: 0.95rem;
        }

        .port-label i {
            color: #28a745;
            margin-right: 8px;
        }

        .card-body-custom {
            padding: 16px 18px 18px;
        }

        /* STATUS */
        .status-badge {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 30px;
            text-transform: uppercase;
        }

        .status-available {
            background: #d4edda;
            color: #155724;
        }

        .status-charging {
            background: #cce5ff;
            color: #004085;
            animation: pulse-bg 1.8s infinite;
        }

        .status-completed {
            background: #fff3cd;
            color: #856404;
        }

        @keyframes pulse-bg {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* TIMER */
        .timer-display {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e3c5c;
            letter-spacing: 1px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 6px 0;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* STATS */
        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0 6px;
            font-size: 0.85rem;
            color: #2d4059;
            border-bottom: 1px dashed #e9edf4;
            margin-bottom: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #8a99aa;
            letter-spacing: 0.4px;
            font-weight: 500;
        }

        .stat-value {
            font-weight: 600;
            color: #1e3c5c;
            font-size: 0.95rem;
        }

        .stat-value.amount {
            color: #28a745;
        }

        /* BUTTONS */
        .port-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .port-actions .btn {
            font-size: 0.7rem;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 10px;
            flex: 1 0 auto;
            min-width: 52px;
        }

        /* FOOTER */
        .dashboard-footer {
            text-align: center;
            padding: 24px 0 10px;
            color: #8a99aa;
            font-size: 0.8rem;
            border-top: 1px solid #e9edf4;
            margin-top: 32px;
        }

        /* TOAST */
        .toast-container-custom {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
            width: calc(100% - 48px);
        }

        .toast-custom {
            background: #1e3c5c;
            color: #fff;
            padding: 12px 18px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInToast 0.35s ease;
            border-left: 4px solid #28a745;
        }

        .toast-custom i {
            font-size: 1.2rem;
            color: #28a745;
        }

        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            cursor: pointer;
        }

        @keyframes slideInToast {
            0% {
                opacity: 0;
                transform: translateX(40px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 576px) {
            .operator-header {
                padding: 10px 16px;
            }

            .operator-header .brand {
                font-size: 1rem;
            }

            .operator-header .brand small {
                display: none;
            }

            .dashboard-wrapper {
                padding: 16px 12px 20px;
            }

            .section-title {
                font-size: 1.2rem;
            }

            .section-subtitle {
                font-size: 0.8rem;
                padding-left: 10px;
            }

            .timer-display {
                font-size: 1.3rem;
            }

            .port-actions .btn {
                flex: 1 1 100%;
                font-size: 0.65rem;
                padding: 8px 6px;
            }

            .stat-value {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header class="operator-header d-flex flex-wrap align-items-center justify-content-between">

    <div class="d-flex align-items-center gap-2 gap-sm-3">

        <div class="brand">
            <i class="fas fa-charging-station"></i>
            AA Jino EV
            <small>Charging Station</small>
        </div>

        <span class="page-title d-none d-sm-inline">
            <i class="fas fa-tachometer-alt"></i>
            Dashboard
        </span>

    </div>

    <div class="d-flex align-items-center gap-2 gap-sm-3">

        <div class="user-info">

            <i class="fas fa-user-circle"></i>

            <span id="operatorName" class="d-none d-sm-inline">
                Jino
            </span>

            <span class="badge-operator">
                Operator
            </span>

        </div>

        <a href="login.html"
           class="logout-link"
           onclick="sessionStorage.removeItem('loggedIn')">

            <i class="fas fa-sign-out-alt"></i>

            <span class="d-none d-sm-inline">
                Logout
            </span>

        </a>

    </div>

</header>


<!-- DASHBOARD -->
<div class="dashboard-wrapper">

    <div class="d-flex flex-wrap align-items-center justify-content-between mb-2">

        <div>

            <h5 class="section-title mb-0">

                <i class="fas fa-bolt text-success me-2"></i>

                Live Charging Ports

            </h5>

            <div class="section-subtitle">

                Monitor and manage all active charging sessions

            </div>

        </div>

        <div class="mt-2 mt-sm-0">

            <span class="badge bg-light text-dark border px-3 py-2">

                <i class="fas fa-plug text-success me-1"></i>

                <span id="portCountDisplay">4</span>

                Ports

            </span>

        </div>

    </div>


    <!-- PORTS -->
    <div class="row g-4" id="portsContainer"></div>


    <!-- FOOTER -->
    <div class="dashboard-footer">

        <marquee>

            <h1 style="font-size:150px;color:red">

                Welcome to AA Jino Electric Vehicle Charging Station and Maintenance Services

            </h1>

        </marquee>

    </div>

</div>


<!-- TOAST -->
<div class="toast-container-custom" id="toastContainer"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

    // ============================================================
    // CONFIGURATION
    // ============================================================

    const PORTS_COUNT = 4;

    const RATE_KW = 7.2;

    const PRICE_PER_KWH = 150;

    const STORAGE_KEY = "chargingPorts";


    // ============================================================
    // STATE
    // ============================================================

    let ports = [];


    // ============================================================
    // FORMAT TIME
    // ============================================================

    function formatTime(sec) {

        sec = Math.max(0, Math.floor(sec));

        const h = String(Math.floor(sec / 3600)).padStart(2, "0");

        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");

        const s = String(Math.floor(sec % 60)).padStart(2, "0");

        return `${h}:${m}:${s}`;
    }


    // ============================================================
    // GENERATE RECEIPT
    // ============================================================

    function generateReceipt() {

        return "RCP-" +
            Date.now().toString().slice(-8) +
            "-" +
            Math.floor(Math.random() * 1000);

    }


    // ============================================================
    // SAVE HISTORY
    // ============================================================

    function saveToHistory(receipt) {

        let history =
            JSON.parse(
                localStorage.getItem("chargingHistory") || "[]"
            );

        history.push(receipt);

        localStorage.setItem(
            "chargingHistory",
            JSON.stringify(history)
        );

    }


    // ============================================================
    // SAVE PORTS
    // ============================================================

    function savePorts() {

        const data = ports.map(function(p) {

            if (!p) return null;

            return {

                id: p.id,

                status: p.status,

                timer: p.timer,

                energy: p.energy,

                amount: p.amount,

                running: p.running,

                startTime: p.startTime,

                stopTime: p.stopTime,

                receipt: p.receipt

            };

        });

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

    }


    // ============================================================
    // CREATE DEFAULT PORTS
    // ============================================================

    function createDefaultPorts() {

        ports = [];

        for (let i = 1; i <= PORTS_COUNT; i++) {

            ports[i] = {

                id: i,

                status: "Available",

                timer: 0,

                energy: 0,

                amount: 0,

                interval: null,

                running: false,

                startTime: null,

                stopTime: null,

                receipt: null

            };

        }

        savePorts();

    }


    // ============================================================
    // LOAD PORTS
    // ============================================================

    function initPorts() {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {

            createDefaultPorts();

            return;

        }

        try {

            const savedPorts = JSON.parse(saved);

            ports = [];

            for (let i = 1; i <= PORTS_COUNT; i++) {

                const savedPort = savedPorts[i];

                if (savedPort) {

                    ports[i] = {

                        id: savedPort.id || i,

                        status: savedPort.status || "Available",

                        timer: savedPort.timer || 0,

                        energy: savedPort.energy || 0,

                        amount: savedPort.amount || 0,

                        interval: null,

                        running: savedPort.running || false,

                        startTime: savedPort.startTime || null,

                        stopTime: savedPort.stopTime || null,

                        receipt: savedPort.receipt || null

                    };

                } else {

                    ports[i] = {

                        id: i,

                        status: "Available",

                        timer: 0,

                        energy: 0,

                        amount: 0,

                        interval: null,

                        running: false,

                        startTime: null,

                        stopTime: null,

                        receipt: null

                    };

                }

            }


            // Recalculate currently charging ports

            for (let i = 1; i <= PORTS_COUNT; i++) {

                const p = ports[i];

                if (
                    p.status === "Charging" &&
                    p.startTime
                ) {

                    p.timer = Math.floor(
                        (Date.now() - p.startTime) / 1000
                    );

                    p.energy =
                        (p.timer / 3600) * RATE_KW;

                    p.amount =
                        p.energy * PRICE_PER_KWH;

                    p.running = true;

                }

            }

        } catch (error) {

            console.error(
                "Could not load saved charging data:",
                error
            );

            createDefaultPorts();

        }

    }


    // ============================================================
    // TOAST
    // ============================================================

    function showToast(msg, type = "success") {

        const container =
            document.getElementById("toastContainer");

        const toast =
            document.createElement("div");

        toast.className = "toast-custom";

        const icon =
            type === "success"
                ? "fa-check-circle"
                : "fa-exclamation-circle";

        toast.innerHTML = `

            <i class="fas ${icon}"></i>

            <span>${msg}</span>

            <button
                class="toast-close"
                onclick="this.parentElement.remove()">

                &times;

            </button>

        `;

        container.appendChild(toast);

        setTimeout(function() {

            if (toast.parentElement) {

                toast.remove();

            }

        }, 4500);

    }


    // ============================================================
    // RENDER PORTS
    // ============================================================

    function renderPorts() {

        const container =
            document.getElementById("portsContainer");

        container.innerHTML = "";

        document.getElementById(
            "portCountDisplay"
        ).textContent = PORTS_COUNT;


        for (let i = 1; i <= PORTS_COUNT; i++) {

            const p = ports[i];


            const statusClass =
                p.status === "Available"
                    ? "status-available"
                    : p.status === "Charging"
                        ? "status-charging"
                        : "status-completed";


            const card =
                document.createElement("div");

            card.className =
                "col-12 col-sm-6 col-xl-3";


            card.innerHTML = `

                <div class="port-card">

                    <div class="card-header-custom">

                        <span class="port-label">

                            <i class="fas fa-plug"></i>

                            Port ${i}

                        </span>


                        <span
                            class="status-badge ${statusClass}"
                            id="statusBadge_${i}">

                            ${p.status}

                        </span>

                    </div>


                    <div class="card-body-custom">

                        <div
                            class="timer-display mb-2"
                            id="timer_${i}">

                            ${formatTime(p.timer)}

                        </div>


                        <div class="stats-row">

                            <div c
